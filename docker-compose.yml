name: virtualclass

services:
  postgres:
    image: postgres:15
    container_name: vc-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vc}
      POSTGRES_USER: ${POSTGRES_USER:-vc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vc}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vc} -d ${POSTGRES_DB:-vc}"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    restart: unless-stopped
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vc-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-vc}:${POSTGRES_PASSWORD:-vc}@postgres:5432/${POSTGRES_DB:-vc}?schema=public
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/virtualclass-ai}
      PROJECT_ROOT: /workspace
    volumes:
      - ./:/workspace:ro
      - uploads_data:/app/uploads
    ports:
      - "3001:3001"
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: ${BACKEND_MEM_LIMIT:-768m}
    restart: unless-stopped
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: vc-frontend
    expose:
      - "4173"
    depends_on:
      - backend
    mem_limit: ${FRONTEND_MEM_LIMIT:-512m}
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: vc-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    mem_limit: ${NGINX_MEM_LIMIT:-256m}
    restart: unless-stopped
    networks:
      - internal

  prometheus:
    image: prom/prometheus:latest
    container_name: vc-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-512m}
    restart: unless-stopped
    networks:
      - internal

  node-exporter:
    image: prom/node-exporter:latest
    container_name: vc-node-exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/rootfs:ro
    mem_limit: ${NODE_EXPORTER_MEM_LIMIT:-128m}
    restart: unless-stopped
    networks:
      - internal

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: vc-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-vc}:${POSTGRES_PASSWORD:-vc}@postgres:5432/${POSTGRES_DB:-vc}?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: ${POSTGRES_EXPORTER_MEM_LIMIT:-128m}
    restart: unless-stopped
    networks:
      - internal

  grafana:
    image: grafana/grafana:11.5.1
    container_name: vc-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_SERVER_ROOT_URL: http://${SERVER_IP}:3000
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    mem_limit: ${GRAFANA_MEM_LIMIT:-256m}
    restart: unless-stopped
    networks:
      - internal

  alertmanager:
    image: prom/alertmanager:latest
    container_name: vc-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    mem_limit: ${ALERTMANAGER_MEM_LIMIT:-128m}
    restart: unless-stopped
    networks:
      - internal

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: vc-nginx-exporter
    command:
      - '-nginx.scrape-uri=http://nginx:80/nginx_status'
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    mem_limit: ${NGINX_EXPORTER_MEM_LIMIT:-64m}
    restart: unless-stopped
    networks:
      - internal

  telegram-bot:
    build:
      context: ./monitoring/telegram-bot
    container_name: vc-telegram-bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      PROMETHEUS_URL: http://prometheus:9090
      ALERTMANAGER_URL: http://alertmanager:9093
      GRAFANA_URL: http://${SERVER_IP}:3000
      SERVER_IP: ${SERVER_IP}
    depends_on:
      - prometheus
      - alertmanager
    mem_limit: ${TELEGRAM_BOT_MEM_LIMIT:-256m}
    restart: unless-stopped
    networks:
      - internal

  n8n:
    image: n8nio/n8n:latest
    container_name: vc-n8n
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-your-secret-encryption-key-change-me}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      N8N_API_KEY: ${N8N_API_KEY:-n8n_api_key_change_me}
      N8N_PUBLIC_API_ENABLED: "true"
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/virtualclass-ai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/data/workflows:ro
    depends_on:
      - backend
    entrypoint: ["/bin/sh", "/data/workflows/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    mem_limit: ${N8N_MEM_LIMIT:-512m}
    restart: unless-stopped
    networks:
      - internal

  backup:
    image: postgres:15-alpine
    container_name: vc-backup
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vc}
      POSTGRES_USER: ${POSTGRES_USER:-vc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vc}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backup/scripts:/scripts:ro
      - ./backup/data:/backups
    command: ["sh", "/scripts/backup.sh"]
    mem_limit: ${BACKUP_MEM_LIMIT:-256m}
    restart: unless-stopped
    networks:
      - internal

  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: vc-fail2ban
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - nginx
    environment:
      TZ: ${TZ:-Asia/Almaty}
    volumes:
      - ./security/fail2ban/jail.local:/data/jail.local:ro
      - ./security/fail2ban/filter.d:/data/filter.d:ro
      - nginx_logs:/var/log/nginx:ro
      - /var/log:/var/log:ro
    mem_limit: ${FAIL2BAN_MEM_LIMIT:-256m}
    restart: unless-stopped
    profiles:
      - security

  ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: vc-ssh
    environment:
      TZ: ${TZ:-Asia/Almaty}
      PUID: ${SSH_PUID:-1000}
      PGID: ${SSH_PGID:-1000}
      SUDO_ACCESS: false
      PASSWORD_ACCESS: false
      USER_NAME: ${SSH_USER:-vcadmin}
      PUBLIC_KEY_FILE: /config/keys/authorized_keys
    ports:
      - "2222:2222"
    volumes:
      - ./security/ssh/config:/config
      - ./backup/data:/workspace/backup:ro
    mem_limit: ${SSH_MEM_LIMIT:-128m}
    restart: unless-stopped
    profiles:
      - security
    networks:
      - internal

  jenkins:
    build:
      context: ./ci/jenkins
      dockerfile: Dockerfile
    container_name: vc-jenkins
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
    mem_limit: ${JENKINS_MEM_LIMIT:-1024m}
    restart: unless-stopped
    profiles:
      - ci
    networks:
      - internal

volumes:
  pgdata:
  nginx_logs:
  uploads_data:
  jenkins_home:
  n8n_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  internal:
    driver: bridge
