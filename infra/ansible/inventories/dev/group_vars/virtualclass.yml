project_dir: /opt/virtualclass
repo_url: https://github.com/miko06/VirtualClass.git
repo_version: main
docker_compose_profile: ""
compose_file: docker-compose.prod.yml
ansible_user: "{{ lookup('env', 'USER') }}"

app_env:
  POSTGRES_DB: vc
  POSTGRES_USER: vc
  POSTGRES_PASSWORD: "{{ POSTGRES_PASSWORD }}"
  POSTGRES_MEM_LIMIT: 512m
  BACKEND_MEM_LIMIT: 768m
  FRONTEND_MEM_LIMIT: 512m
  NGINX_MEM_LIMIT: 256m
  BACKUP_MEM_LIMIT: 256m
  FAIL2BAN_MEM_LIMIT: 256m
  SSH_MEM_LIMIT: 128m
  JENKINS_MEM_LIMIT: 1024m
  N8N_MEM_LIMIT: 512m
  PROMETHEUS_MEM_LIMIT: 512m
  NODE_EXPORTER_MEM_LIMIT: 128m
  POSTGRES_EXPORTER_MEM_LIMIT: 128m
  GRAFANA_MEM_LIMIT: 256m
  ALERTMANAGER_MEM_LIMIT: 128m
  TELEGRAM_BOT_MEM_LIMIT: 256m
  BACKUP_RETENTION_DAYS: 7
  BACKUP_INTERVAL_SECONDS: 86400
  N8N_WEBHOOK_URL: "{{ N8N_WEBHOOK_URL | default('http://n8n:5678/webhook/virtualclass-ai') }}"
  N8N_ENCRYPTION_KEY: "{{ N8N_ENCRYPTION_KEY }}"
  N8N_API_KEY: "{{ N8N_API_KEY }}"
  N8N_EDITOR_BASE_URL: "{{ N8N_EDITOR_BASE_URL | default('http://10.82.225.213:5678') }}"
  OPENAI_API_KEY: "{{ OPENAI_API_KEY }}"
  TELEGRAM_BOT_TOKEN: "{{ TELEGRAM_BOT_TOKEN }}"
  TELEGRAM_CHAT_ID: "{{ TELEGRAM_CHAT_ID }}"
  SERVER_IP: "{{ SERVER_IP | default('10.82.225.213') }}"
  GRAFANA_USER: "{{ GRAFANA_USER | default('admin') }}"
  GRAFANA_PASSWORD: "{{ GRAFANA_PASSWORD }}"
  TZ: "{{ TZ | default('Asia/Almaty') }}"
  SSH_USER: vcadmin
  SSH_PUID: 1000
  SSH_PGID: 1000
