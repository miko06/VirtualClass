global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: telegram-webhook

receivers:
  - name: telegram-webhook
    webhook_configs:
      - url: 'http://telegram-bot:8080/webhook/alert'
        send_resolved: true
